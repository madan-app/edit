<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Graphite — Photo Editor</title>
<meta name="description" content="A fast, private, offline-first photo editor that runs entirely in your browser." />
<meta name="theme-color" content="#14161a" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%2349c5b6'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./css/main.css" />
<link rel="stylesheet" href="./css/editor.css" />
<link rel="stylesheet" href="./css/panels.css" />
<link rel="stylesheet" href="./css/responsive.css" />
</head>
<body>

<div id="app">

  <!-- ============== TOP BAR ============== -->
  <header id="topbar">
    <div class="logo">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18" opacity=".4"/></svg>
      <span>Graphite</span>
    </div>

    <button class="topbar-btn" id="new-btn" data-tip="New" aria-label="New photo">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg><span class="label">New</span>
    </button>
    <button class="topbar-btn" id="open-btn-top" aria-label="Open photo">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg><span class="label">Open</span>
    </button>
    <button class="topbar-btn" id="save-btn" aria-label="Save project">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M8 4v6h8V4"/></svg><span class="label">Save</span>
    </button>

    <span class="topbar-sep"></span>

    <button class="topbar-btn" id="undo-btn" disabled aria-label="Undo" title="Undo (Ctrl/Cmd+Z)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10h11a5 5 0 0 1 0 10H9"/><path d="M9 5 4 10l5 5"/></svg>
    </button>
    <button class="topbar-btn" id="redo-btn" disabled aria-label="Redo" title="Redo (Ctrl/Cmd+Shift+Z)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10H9a5 5 0 0 0 0 10h6"/><path d="M15 5l5 5-5 5"/></svg>
    </button>

    <span class="topbar-sep"></span>

    <button class="topbar-btn" id="compare-btn" aria-label="Before and after" title="Before/After (\\)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M12 4v16"/></svg><span class="label">Before/After</span>
    </button>

    <span class="topbar-spacer"></span>
    <span class="file-info-inline" id="topbar-filename"></span>

    <button class="topbar-btn primary-ish" id="export-btn" style="color:var(--accent);" aria-label="Export">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v12"/><path d="M7 11l5 5 5-5"/><path d="M5 19h14"/></svg><span class="label">Export</span>
    </button>
  </header>

  <!-- ============== WORKSPACE ============== -->
  <div id="workspace">

    <!-- LEFT TOOL RAIL -->
    <nav id="tool-rail" aria-label="Tools">
      <button class="tool-btn active" data-tool="move" data-tip="Move (V)" aria-label="Move"><svg viewBox="0 0 24 24" width="19" height="19"><path d="M12 2l3 3h-2v5h5V8l3 3-3 3v-2h-5v5h2l-3 3-3-3h2v-5H6v2l-3-3 3-3v2h5V5H9z"/></svg></button>
      <button class="tool-btn" data-tool="crop" data-tip="Crop (C)" aria-label="Crop"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M2 6h14a2 2 0 0 1 2 2v14"/></svg></button>
      <button class="tool-btn" data-tool="transform" data-tip="Transform" aria-label="Transform"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M9 4v16"/></svg></button>
      <div class="rail-sep"></div>
      <button class="tool-btn" data-tool="brush" data-tip="Brush (B)" aria-label="Brush"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20c0-3 2-4 4-4s3 2 5 2 3-6 7-10"/><path d="M13.5 6.5l4 4"/></svg></button>
      <button class="tool-btn" data-tool="eraser" data-tip="Eraser (E)" aria-label="Eraser"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 3l4 4-11 11H6l-2-2z"/><path d="M8 17l-5-5"/></svg></button>
      <button class="tool-btn" data-tool="healing" data-tip="Healing brush" aria-label="Healing brush"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v6M9 6h6"/><circle cx="12" cy="15" r="6"/></svg></button>
      <button class="tool-btn" data-tool="clone" data-tip="Clone stamp" aria-label="Clone stamp"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="5" width="11" height="11" rx="1.5"/><rect x="9" y="9" width="11" height="11" rx="1.5"/></svg></button>
      <button class="tool-btn" data-tool="spot" data-tip="Spot removal" aria-label="Spot removal"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="5"/><path d="M4 12h2M18 12h2M12 4v2M12 18v2"/></svg></button>
      <button class="tool-btn" data-tool="redeye" data-tip="Red-eye removal" aria-label="Red-eye removal"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/></svg></button>
      <div class="rail-sep"></div>
      <button class="tool-btn" data-tool="selection" data-tip="Selection (M)" aria-label="Selection"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
      <button class="tool-btn" data-tool="text" data-tip="Text (T)" aria-label="Text"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5h14M12 5v14"/></svg></button>
      <button class="tool-btn" data-tool="shapes" data-tip="Shapes" aria-label="Shapes"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l9 9-9 9-9-9z"/></svg></button>
      <button class="tool-btn" data-tool="stickers" data-tip="Stickers" aria-label="Stickers"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.9 6.3L21 9l-5 4.6L17.5 21 12 17.6 6.5 21 8 13.6 3 9l6.1-.7z"/></svg></button>
      <button class="tool-btn" data-tool="draw" data-tip="Draw" aria-label="Draw"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l3-1 11-11-2-2L5 17z"/></svg></button>
      <button class="tool-btn" data-tool="background" data-tip="Background" aria-label="Background tools"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="1.5"/><circle cx="9" cy="10" r="2"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg></button>
      <div class="rail-sep"></div>
      <button class="tool-btn" data-tool="layers" data-tip="Layers" aria-label="Layers"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
    </nav>

    <!-- CENTER STAGE -->
    <section id="stage" class="no-image">
      <div class="tool-options-bar" id="tool-options-bar"></div>
      <div id="canvas-viewport">
        <div id="canvas-stack">
          <canvas id="main-canvas" class="smooth"></canvas>
          <canvas id="overlay-canvas"></canvas>
          <div id="compare-divider" class="hidden"></div>
        </div>
        <p id="empty-canvas-hint">Open a photo, or drop one here, to start editing.</p>
      </div>
      <div id="zoom-bar">
        <button class="zoom-btn" id="zoom-out-btn" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <span id="zoom-level">100%</span>
        <button class="zoom-btn" id="zoom-in-btn" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="toggle-chip" id="zoom-fit-btn">Fit</button>
        <button class="toggle-chip" id="zoom-100-btn">100%</button>
        <button class="toggle-chip" id="grid-toggle-btn">Grid</button>
        <span class="zoom-sep"></span>
      </div>
    </section>

    <!-- RIGHT PANEL -->
    <aside id="right-panel" aria-label="Editing panels">
      <div id="panel-tabs" role="tablist">
        <button class="panel-tab active" data-tab="adjust">Adjust</button>
        <button class="panel-tab" data-tab="color">Color</button>
        <button class="panel-tab" data-tab="effects">Effects</button>
        <button class="panel-tab" data-tab="filters">Filters</button>
        <button class="panel-tab" data-tab="presets">Presets</button>
        <button class="panel-tab" data-tab="masking">Masking</button>
        <button class="panel-tab" data-tab="layers">Layers</button>
        <button class="panel-tab" data-tab="history">History</button>
        <button class="panel-tab" data-tab="export">Export</button>
      </div>
      <div id="panel-body"></div>
    </aside>
  </div>

  <!-- ============== STATUS BAR ============== -->
  <footer id="statusbar">
    <span class="status-msg" id="status-msg">Ready.</span>
    <span id="status-dims"></span>
    <span id="status-fileinfo"></span>
  </footer>
</div>

<!-- ============== MOBILE BOTTOM SHEET SCRIM ============== -->
<div id="mobile-sheet-backdrop" class="hidden"></div>

<!-- ============== START SCREEN ============== -->
<div id="start-screen">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18" opacity=".4"/></svg>
    Graphite Photo Editor
  </div>
  <p class="hint">A fast, private photo editor that runs entirely in your browser. Nothing you open here ever leaves your device.</p>
  <div class="start-actions">
    <button class="btn primary" id="open-btn-start">Open Photo</button>
  </div>
  <div class="recent-projects">
    <h3>Recent projects</h3>
    <div class="recent-list" id="recent-list"></div>
  </div>
</div>

<input type="file" id="file-input" accept="image/jpeg,image/jpg,image/png,image/webp" class="hidden" />

<div id="toast-stack" aria-live="polite"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
